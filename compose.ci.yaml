# GitHub Actions (.github/workflows/test.yml): the runner's user is UID 1001,
# so the services must run as that user to write vendor/ and the test results
# into the checked-out project. Group 0 as on OpenShift.
services:
  webhook:
    user: "1001:0"
  worker:
    user: "1001:0"
  crawler:
    user: "1001:0"
