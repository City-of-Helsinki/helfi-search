parameters:
    # Read on every request and every worker run, so edits apply without a
    # restart. See src/CrawlerConfig.php.
    app.crawler_config: '%kernel.project_dir%/config/crawler.yml'
    # The queue, shared by the webhook and the workers: one Redis server
    # (REDIS_URL) or a Sentinel setup (REDIS_SENTINELS). See
    # src/Queue/RedisClientFactory.php and src/Queue/RedisQueue.php.
    env(REDIS_URL): 'redis://redis:6379'
    env(REDIS_SENTINELS): ''
    env(REDIS_SENTINEL_SERVICE): ''
    env(REDIS_PASSWORD): ''
    env(REDIS_SENTINEL_PASSWORD): ''
    env(REDIS_DB): '0'
    # Prepended to every key, so a shared Redis is safe.
    env(REDIS_PREFIX): 'helfi-search:'
    # The webhook's shared secret. Every request but /health is refused if it's
    # empty.
    env(WEBHOOK_TOKEN): ''
    env(APP_SECRET): ''
    # The search index (an alias), the embedding cache, and the start of the
    # names of the crawls' own indexes. See src/Indexer/Indexes.php.
    app.search_index: hel-fi
    app.embedding_cache_index: hel-fi-embedding-cache
    app.crawl_index_prefix: hel-fi-pages
    # The embeddings API. Without a key, development uses made-up vectors.
    # See src/Embedding/OpenAiEmbeddingClient.php.
    env(OPENAI_API_KEY): ''
    env(OPENAI_BASE_URL): 'https://api.openai.com/v1'
    # Elements with these classes aren't page content (src/Pipeline/HtmlCleaner.php).
    app.ignored_classes:
        - is-hidden
        - visually-hidden
        - skip-link
        - table-of-contents
        - component--recommendations
        - component--map
        - component--hearings
        - component--list-of-links
        - announcement
        - content-tags
        - content-date
        - content-links
        - block--askem

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            # Values, not services.
            - '../src/CrawlerConfig.php'
            - '../src/Site.php'
            - '../src/Queue/{Action,Batch}.php'
            - '../src/Worker/{BatchResult,Lease,Stopped}.php'
            - '../src/Pipeline/{Chunk,Document,Heading,HeadingFragment,PipelineException,Text}.php'
            - '../src/Embedding/{EmbeddingException,EmbeddingModel,Vector}.php'
            - '../src/Indexer/{Page,PageMetadata,ProcessedPage}.php'
            # Created per run, from the crawler config.
            - '../src/Worker/Elasticsearch.php'
            - '../src/Worker/FailedDocumentCounter.php'
            - '../src/Indexer/{EmbeddingCache,SearchIndex}.php'
            # Created by EmbeddingClientFactory.
            - '../src/Embedding/{FakeEmbeddingClient,OpenAiEmbeddingClient}.php'

    App\CrawlerConfigLoader:
        arguments: ['%app.crawler_config%']

    Predis\ClientInterface:
        factory: ['App\Queue\RedisClientFactory', 'create']
        arguments:
            $url: '%env(REDIS_URL)%'
            $sentinels: '%env(REDIS_SENTINELS)%'
            $sentinelService: '%env(REDIS_SENTINEL_SERVICE)%'
            $password: '%env(REDIS_PASSWORD)%'
            $sentinelPassword: '%env(REDIS_SENTINEL_PASSWORD)%'
            $database: '%env(REDIS_DB)%'

    App\Embedding\EmbeddingClient:
        factory: ['App\Embedding\EmbeddingClientFactory', 'create']
        arguments:
            $apiKey: '%env(OPENAI_API_KEY)%'
            $baseUrl: '%env(OPENAI_BASE_URL)%'
            $environment: '%kernel.environment%'

    App\Indexer\Indexes:
        arguments: ['%app.search_index%', '%app.embedding_cache_index%', '%app.crawl_index_prefix%']

    App\Webhook\TokenListener:
        arguments:
            $token: '%env(WEBHOOK_TOKEN)%'

when@test:
    services:
        # Never the real API in tests.
        App\Embedding\EmbeddingClient:
            class: App\Embedding\FakeEmbeddingClient

    parameters:
        # Tests point this at a temporary file, and REDIS_PREFIX at their own
        # keys: see tests/KernelEnvironmentTrait.php.
        app.crawler_config: '%env(TEST_CRAWLER_CONFIG)%'
