<svg xmlns="http://www.w3.org/2000/svg" width="930" height="210" viewBox="0 0 930 210" role="img" aria-labelledby="title desc">
  <title id="title">Hel.fi search architecture</title>
  <desc id="desc">hel.fi sites send POST /webhook to the webhook, which adds the change to the Redis queue. Workers take changes from the queue and index them into Elasticsearch. The full crawl indexes into Elasticsearch too.</desc>
  <style>
    svg { --fg: #1f2328; --muted: #59636e; --line: #59636e; --service: #ffffff; --accent: #0969da; --store: #f6f8fa; --store-stroke: #afb8c1; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #f0f6fc; --muted: #9198a1; --line: #9198a1; --service: #0d1117; --accent: #4493f8; --store: #212830; --store-stroke: #3d444d; }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--fg); text-anchor: middle; }
    .title { font-size: 14px; font-weight: 600; }
    .sub, .label { font-size: 12px; fill: var(--muted); }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .service { fill: var(--service); stroke: var(--accent); stroke-width: 1.5; }
    .store { fill: var(--store); stroke: var(--store-stroke); stroke-width: 1.5; }
    .edge { stroke: var(--line); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .head { fill: var(--line); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head" d="M0 0L10 5L0 10z"/>
    </marker>
  </defs>

  <!-- Boxes -->
  <rect class="service" x="20" y="30" width="120" height="60" rx="8"/>
  <text class="title" x="80" y="65">hel.fi site</text>

  <rect class="service" x="250" y="30" width="120" height="60" rx="8"/>
  <text class="title" x="310" y="56">webhook</text>
  <text class="sub" x="310" y="75">FrankenPHP</text>

  <rect class="store" x="420" y="30" width="130" height="60" rx="8"/>
  <text class="title" x="485" y="56">Redis</text>
  <text class="sub" x="485" y="75">queue</text>

  <rect class="service" x="600" y="30" width="120" height="60" rx="8"/>
  <text class="title" x="660" y="56">workers</text>
  <text class="sub mono" x="660" y="75">app:worker</text>

  <rect class="store" x="770" y="30" width="140" height="60" rx="8"/>
  <text class="title" x="840" y="65">Elasticsearch</text>

  <rect class="service" x="600" y="130" width="120" height="60" rx="8"/>
  <text class="title" x="660" y="156">full crawl</text>
  <text class="sub mono" x="660" y="175">app:crawl</text>

  <!-- Edges -->
  <path class="edge" d="M140 60H249"/>
  <text class="label mono" x="195" y="50">POST /webhook</text>
  <path class="edge" d="M370 60H419"/>
  <path class="edge" d="M550 60H599"/>
  <path class="edge" d="M720 60H769"/>
  <path class="edge" d="M720 160H840V91"/>
</svg>
